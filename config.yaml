workers: 3

asr:
  enabled: true
  # FunASR 依赖 py3.9，通常单独建 venv。留空则自动探测
  # ~/coding/FunASR/.venv/bin/python，也可用环境变量 FUNASR_PYTHON 指定
  python: ""
  # sensevoice: 230M 非自回归，480s 素材 68s（paraformer 要 106-148s），
  #             还会附带情感/音频事件标签，用来找冲突点
  # paraformer: SeACo-Paraformer large，原生句级时间戳，作为对照与兜底
  engine: sensevoice
  model: paraformer-zh
  device: cpu
  # 0 = 自动取性能核数（M5 是 4）。SenseVoice 超过性能核数反而变慢：
  # 实测 4 线程 68s、8 线程 155s
  ncpu: 0
  batch_size_s: 120
  timeout: 1800

ocr:
  enabled: true
  backend: ppocr
  # PP-OCRv4 ONNX 模型。留空则用 rapidocr-onnxruntime 自带的 PP-OCRv4 模型；
  # 想指定本地权重就填绝对路径（det / rec / cls 三个）
  det_model: ""
  rec_model: ""
  cls_model: ""
  fps: 2.0
  band_top: 0.42
  change_threshold: 5.0
  min_confidence: 0.55
  det_limit_side_len: 480   # 检测输入长边，默认 736；降到 480 快一倍且字幕仍准确
  # ONNX 线程配额。默认按核数开会占到 5.8 个核，限到 3 是 3.5 个核、
  # 墙钟只慢 3%。三路信号并行时必须限，否则会抢 ASR 的核
  threads: 3

vision:
  fps: 4.0
  width: 160
  height: 90
  use_pyscene: true
  adaptive_threshold: 3.0
  scene_threshold: 0.28
  min_shot: 0.7
  max_shot: 12.0
  blank_std: 6.0

bgm:
  enabled: true
  gain_db: 0.0
  bgm_lufs: -17.0
  duck_threshold: 0.10
  duck_ratio: 3.5
  fade_in: 0.3
  fade_out: 0.8
  target_loudness: -14.0
  max_stretch: 0.45
  min_beat_cv: 0.22

recall:
  candidates: 32
  candidates_max: 96
  min_gap: 6.0
  cand_step: 10.0
  min_beat: 2.0
  max_beat: 8.0
  head_skip: 0.02
  tail_skip: 0.06

planner:
  enabled: true
  base_url: "https://api.deepseek.com/v1"
  model: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.7
  max_tokens: 2400
  timeout: 180
  retries: 3
  target_seconds: 52
  min_seconds: 32
  max_seconds: 95
  # 题材策略文件：由运营数据生成（fsm-ops 的 `ops strategy --build` 产出 yaml），
  # 给了就按里面的题材偏好改写选段要求与钩子用词；留空用内置通用规则。
  # 也可用 `fsm run --strategy <path>` 临时指定。
  strategy_file: ""

# 出片数量。同一部剧可以出多套互不重复的方案（组合式批量出片）：
#   --total 6      → 自动拆成 3+3 两套
#   --variants 3   → 3 套，每套 output.reels 条
#   --reels 3      → 1 套 3 条
output:
  reels: 2
  variants: 1
  per_plan: 3        # 指定总条数时单套最多几条（一次要 4 条以上，模型会开始凑数）
  max_total: 12      # 单部剧总条数上限
  dedupe_hook: true  # 跨套不复用同一段 hook
  overlap: 0.6       # 与已出方案的候选重合率超过此值即驳回重出

# 跑批时的资源闸门。目标是「机器不限速」，而不是「尽快跑完」：
# 并发按核数与可用内存推算，负载越线就暂停派活，子进程统一降 nice。
resource:
  max_workers: 0            # 0 = 自动（10 核 32GB 实测稳定在 2-3）
  cpu_per_worker: 3         # 每部剧内部本身就有 3 路信号 + 3 线程 ffmpeg
  mem_per_worker_gb: 2.5
  min_free_mem_gb: 3.0
  max_load_per_core: 1.2
  nice: 5
  gate_max_wait: 180

render:
  width: 1080
  height: 1920
  fps: 30
  crf: 22
  preset: ultrafast       # 批量出片优先速度；要画质改 veryfast/superfast（各自加 crf 2）
  loudness_i: -14
  blur_sigma: 24
  audio_bitrate: 192k
  # 编码资源池：硬编走媒体引擎、软编吃 CPU，两者不抢同一种资源，可同时开。
  # 实测 45s 切片：软编 2 槽 + 硬编 2 槽 ≈ 23.6 条/分钟，纯软编 3 槽 21.7。
  encoder: auto           # auto | libx264 | h264_videotoolbox
  cpu_slots: 2
  gpu_slots: 2
  vt_bitrate: 6M          # 硬编只能定码率，画质随内容波动
  # 源片自带搬运水印时的处理。实测 45 秒切片：off 4.67s / crop 4.47s / delogo 4.56s，
  # 三者都在噪声范围内，开去水印基本不花时间。
  # crop 裁掉顶部一条再缩放，效果最干净；delogo 原地插值，画面不损失但文字水印会留灰斑。
  # 水印位置随源而变（台标常右上、账号名常在左上且横向拉很长），换源要重新量 crop_ratio。
  dewatermark:
    # 2026-11-22 实测：B 站下载的短剧源左上角烧着「姜丝剧场 bilibili」，
    # 水印竖向占 1920 的约 90px、横向到 x≈330，属于搬运水印，带着它投稿会被判搬运。
    mode: "crop"          # off | crop | delogo（必须带引号，否则 YAML 会当布尔）
    crop_ratio: 0.08      # crop：裁掉顶部占源高的比例（0.08*1920=154px，覆盖左上/右上角台标）
    x: 0                  # delogo 区域，源分辨率坐标
    y: 0
    w: 0
    h: 0
  # 横屏源怎么装进竖屏画布。
  # auto：上下模糊 + 原画面居中，画面完整但非满屏（默认）
  # crop：按 9:16 居中裁切再缩放，成片满屏，代价是左右各切掉较多
  fit: auto

  # 成片叠加层（2026-11-24）：放大裁切去水印 + 分镜描述 + 旋转水印
  overlay:
    enabled: true
    zoom: 1.06                 # 先放大 6% 再居中裁回 1080x1920，把边缘水印切掉
    caption_enabled: true
    caption_top: 380           # 分镜描述距顶部像素（避开快手顶部 UI 与右上角水印）
    caption_size: 88
    watermark_enabled: true
    watermark_text: "短剧小当家"
    watermark_size: 40
    watermark_opacity: 0.55
    watermark_top: 90
    watermark_right: 36
    watermark_rotate_seconds: 7.0

# 自动补字幕：源片没有内嵌字幕时（OCR 字幕覆盖率低），用 ASR 句子生成字幕烧进成片。
# 本机 ffmpeg 是精简构建（无 libass），所以走 PIL 渲染 PNG + overlay，
# 不依赖 subtitles/drawtext 滤镜。
subtitle:
  auto_fill: true
  mode: auto               # auto | on | off
  coverage_threshold: 0.12 # 字幕覆盖率低于此值视为源片无字幕
  font: ""                 # 留空自动探测系统中文字体
  size: 58
  max_chars: 15
  bottom_pct: 0.06
  stroke: 3
  min_cue: 0.55

# 解说模式：原片只当「引用片段」，成片主体是原创口播 + 文字卡。
# 为什么单开一个模式而不是给切片加配音：抖音驳回的原文是「以片段拼接/拆条
# 形式呈现」，判据是「连续原片画面 + 原声 + 原硬字幕」这个组合，跟水印无关；
# B 站判的是网络剧片资质。平台自己给的出路只有「口播解说、剧情观点梳理」
# 这类原创表达，所以必须把画面主体和音轨都换掉。
#   fsm run x.mp4 --mode commentary
commentary:
  enabled: false            # 用 --mode commentary 打开；改成 true 就是默认模式
  quote_max: 5.0            # 单条引用最长秒数（版权判定里最硬的一个数）
  quote_min: 2.2
  quote_ratio_max: 0.30     # 引用总时长 / 成片时长上限，超了自动压短
  quote_audio_gain_db: -18.0  # 引用段原声压低，主体必须是解说音轨
  quote_inset: 0.78         # 引用画面占画布宽度比例：内缩 + 深色底 = 明确是引用
  pad_color: "0x14161C"
  tts: true                 # 用 macOS say 合成配音；改真人出镜就关掉
  voice: Tingting           # say -v '?' 里 zh_CN 的语音
  rate: 190
  lead_pad: 0.35            # 每段口播尾部留白，避免两段粘连
  card_bg: "#2A3342"        # 必须亮于 10% 亮度，纯黑卡会被 QC 判黑场
  card_accent: "#E0A458"
  card_footer: "剧情评述 · 片段引用"
  talk_min_chars: 40
  talk_max_chars: 85
  llm: true                 # 口播词用 DeepSeek；关掉是规则兜底（必须人工重写）
  bgm: false                # 解说本身有节奏，默认不再铺 BGM
