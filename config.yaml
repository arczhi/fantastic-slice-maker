workers: 3

asr:
  enabled: true
  # FunASR 依赖 py3.9，通常单独建 venv。留空则自动探测
  # ~/coding/FunASR/.venv/bin/python，也可用环境变量 FUNASR_PYTHON 指定
  python: ""
  model: paraformer-zh
  device: cpu
  batch_size_s: 120
  timeout: 1800

ocr:
  enabled: true
  backend: ppocr
  # PP-OCRv4 ONNX 模型。留空则用 rapidocr-onnxruntime 自带的 PP-OCRv4 模型；
  # 想指定本地权重就填绝对路径（det / rec / cls 三个）
  det_model: ""
  rec_model: ""
  cls_model: ""
  fps: 2.0
  band_top: 0.42
  change_threshold: 5.0
  min_confidence: 0.55

vision:
  fps: 4.0
  width: 160
  height: 90
  use_pyscene: true
  adaptive_threshold: 3.0
  scene_threshold: 0.28
  min_shot: 0.7
  max_shot: 12.0
  blank_std: 6.0

bgm:
  enabled: true
  gain_db: 0.0
  bgm_lufs: -20.0
  duck_threshold: 0.15
  duck_ratio: 2.5
  fade_in: 0.4
  fade_out: 1.2
  target_loudness: -14.0
  max_stretch: 0.45
  min_beat_cv: 0.22

recall:
  candidates: 32
  candidates_max: 96
  min_gap: 6.0
  cand_step: 10.0
  min_beat: 2.0
  max_beat: 8.0
  head_skip: 0.02
  tail_skip: 0.06

planner:
  enabled: true
  base_url: "https://api.deepseek.com/v1"
  model: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.7
  max_tokens: 2400
  timeout: 180
  retries: 3
  target_seconds: 52
  min_seconds: 32
  max_seconds: 95

# 出片数量。同一部剧可以出多套互不重复的方案（组合式批量出片）：
#   --total 6      → 自动拆成 3+3 两套
#   --variants 3   → 3 套，每套 output.reels 条
#   --reels 3      → 1 套 3 条
output:
  reels: 2
  variants: 1
  per_plan: 3        # 指定总条数时单套最多几条（一次要 4 条以上，模型会开始凑数）
  max_total: 12      # 单部剧总条数上限
  dedupe_hook: true  # 跨套不复用同一段 hook
  overlap: 0.6       # 与已出方案的候选重合率超过此值即驳回重出

# 跑批时的资源闸门。目标是「机器不限速」，而不是「尽快跑完」：
# 并发按核数与可用内存推算，负载越线就暂停派活，子进程统一降 nice。
resource:
  max_workers: 0            # 0 = 自动（10 核 32GB 实测稳定在 2-3）
  cpu_per_worker: 3         # 每部剧内部本身就有 3 路信号 + 3 线程 ffmpeg
  mem_per_worker_gb: 2.5
  min_free_mem_gb: 3.0
  max_load_per_core: 1.2
  nice: 5
  gate_max_wait: 180

render:
  width: 1080
  height: 1920
  fps: 30
  crf: 20
  preset: veryfast
  loudness_i: -14
  blur_sigma: 24
  audio_bitrate: 192k

# 自动补字幕：源片没有内嵌字幕时（OCR 字幕覆盖率低），用 ASR 句子生成字幕烧进成片。
# 本机 ffmpeg 是精简构建（无 libass），所以走 PIL 渲染 PNG + overlay，
# 不依赖 subtitles/drawtext 滤镜。
subtitle:
  auto_fill: true
  mode: auto               # auto | on | off
  coverage_threshold: 0.12 # 字幕覆盖率低于此值视为源片无字幕
  font: ""                 # 留空自动探测系统中文字体
  size: 58
  max_chars: 15
  bottom_pct: 0.06
  stroke: 3
  min_cue: 0.55
