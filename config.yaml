workers: 3

asr:
  enabled: true
  # FunASR 依赖 py3.9，通常单独建 venv。留空则自动探测
  # ~/coding/FunASR/.venv/bin/python，也可用环境变量 FUNASR_PYTHON 指定
  python: ""
  model: paraformer-zh
  device: cpu
  batch_size_s: 120
  timeout: 1800

ocr:
  enabled: true
  backend: ppocr
  # PP-OCRv4 ONNX 模型。留空则用 rapidocr-onnxruntime 自带的 PP-OCRv4 模型；
  # 想指定本地权重就填绝对路径（det / rec / cls 三个）
  det_model: ""
  rec_model: ""
  cls_model: ""
  fps: 2.0
  band_top: 0.42
  change_threshold: 5.0
  min_confidence: 0.55

vision:
  fps: 4.0
  width: 160
  height: 90
  use_pyscene: true
  adaptive_threshold: 3.0
  scene_threshold: 0.28
  min_shot: 0.7
  max_shot: 12.0
  blank_std: 6.0

bgm:
  enabled: true
  gain_db: 0.0
  bgm_lufs: -20.0
  duck_threshold: 0.15
  duck_ratio: 2.5
  fade_in: 0.4
  fade_out: 1.2
  target_loudness: -14.0
  max_stretch: 0.45
  min_beat_cv: 0.22

recall:
  candidates: 32
  min_beat: 2.0
  max_beat: 8.0
  head_skip: 0.02
  tail_skip: 0.06

planner:
  enabled: true
  base_url: "https://api.deepseek.com/v1"
  model: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.7
  max_tokens: 2400
  timeout: 180
  retries: 3
  target_seconds: 52
  min_seconds: 32
  max_seconds: 95

render:
  width: 1080
  height: 1920
  fps: 30
  crf: 20
  preset: veryfast
  loudness_i: -14
  blur_sigma: 24
  audio_bitrate: 192k
