[project]
name = "fantastic-slice-maker"
version = "0.1.0"
description = "漫剧高光切片全自动流水线：四路信号 + DeepSeek 剪辑单 + 竖屏合成"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.17",
    "rapidocr-onnxruntime>=1.3",
    "scenedetect>=0.6.4",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 只有构建本地 BGM 曲库（./bin/fsm bgm）时才需要
bgm = ["librosa>=0.10", "soundfile>=0.12"]

[project.scripts]
fsm = "fsm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
